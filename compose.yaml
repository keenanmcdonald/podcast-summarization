services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:16686:16686"

  worker:
    build: .
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env or export it}
      TAVILY_API_KEY: ${TAVILY_API_KEY:?Set TAVILY_API_KEY in .env or export it}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_TRACING_MODE: ${LANGSMITH_TRACING_MODE:-langsmith}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: podcast-summarization
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-podcast-summarization}
    volumes:
      - ./mock:/app/mock
    depends_on:
      redis:
        condition: service_healthy

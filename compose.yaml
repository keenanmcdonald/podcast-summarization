services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  worker:
    build: .
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./mock:/app/mock
    depends_on:
      redis:
        condition: service_healthy
